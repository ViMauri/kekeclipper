<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KekeClipper</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.png" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img class="logo-img" src="/favicon.png" alt=""><b>Keke</b>Clipper</a>
    <nav>
      <a href="#/">Directos</a>
      <a href="#/hashtags">Hashtags</a>
      <a href="#/config">Configuración</a>
      <a href="#/setup">Verificación</a>
    </nav>
    <div id="who" class="who"></div>
  </header>

  <main id="view"></main>

  <footer class="foot">
    <span class="credit">creado por: <b>krkmauri</b></span>
    <a class="tw-link" href="https://www.twitch.tv/krkmauri" target="_blank" rel="noopener" title="Canal de Twitch de krkmauri"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.3 3 3 6.4v13.5h4.6V22h2.6l2.2-2.1h3.6l4.8-4.6V3H4.3Zm15.2 11.4-2.9 2.7h-4.5L9.6 19.2v-2.1H5.8V4.7h13.7v9.7ZM16.6 8.1v4.8h-1.7V8.1h1.7Zm-4.7 0v4.8h-1.7V8.1h1.7Z"/></svg>twitch.tv/krkmauri</a>
  </footer>

  <div id="jobs" class="jobs"></div>
  <div id="toast" class="toast"></div>

  <template id="tpl-moment">
    <article class="moment">
      <div class="phone-wrap">
        <div class="phone" data-layout="blur">
          <div class="screen">
            <div class="stage"></div>
            <div class="hook"></div>
            <div class="sub"></div>
            <button class="load-preview">▶ Ver boceto</button>
          </div>
        </div>
        <div class="phone-cap">Boceto 9:16 (vista previa en vivo desde Twitch)</div>
      </div>
      <div class="info">
        <div class="row head">
          <span class="score"></span>
          <span class="tipo"></span>
          <span class="when"></span>
          <label class="sel"><input type="checkbox" class="f-selected" /> incluir</label>
        </div>
        <label>Título <input class="f-titulo" maxlength="100" /></label>
        <label>Descripción <textarea class="f-descripcion" rows="2"></textarea></label>
        <div class="row times">
          <label>Inicio <input class="f-start" /></label>
          <div class="nudge"><button data-n="start:-5">-5s</button><button data-n="start:-1">-1</button><button data-n="start:1">+1</button><button data-n="start:5">+5s</button></div>
          <label>Fin <input class="f-end" /></label>
          <div class="nudge"><button data-n="end:-5">-5s</button><button data-n="end:-1">-1</button><button data-n="end:1">+1</button><button data-n="end:5">+5s</button></div>
          <span class="dur"></span>
        </div>
        <div class="row">
          <label>Formato
            <select class="f-layout">
              <option value="blur">Fondo desenfocado (video completo)</option>
              <option value="crop">Recorte centrado (pantalla completa)</option>
              <option value="facecam">Facecam arriba + juego abajo</option>
            </select>
          </label>
          <button class="act-frame" type="button">📐 Ajustar cámara y encuadre</button>
        </div>
        <div class="framer hidden" tabindex="0">
          <p class="hint framer-help"></p>
          <div class="framer-pic"><img alt="Fotograma del clip" /><div class="framer-loading">Sacando un fotograma del clip…</div></div>
          <div class="framer-tools">
            <span class="fsel">Ajustando: <b class="fsel-name"></b></span>
            <button type="button" data-f="cx" title="Centrar de izquierda a derecha">↔ Centrar</button>
            <button type="button" data-f="cy" title="Centrar de arriba a abajo">↕ Centrar</button>
            <button type="button" data-f="zin" title="Acercar">＋ Zoom</button>
            <button type="button" data-f="zout" title="Alejar">－ Zoom</button>
            <button type="button" data-f="full" title="Lo más alejado posible">⤢ Sin zoom</button>
            <button type="button" data-f="reset">Restablecer</button>
          </div>
          <div class="framer-tools">
            <label class="slider camh">Alto de la cámara en el Short <input type="range" class="f-camH" min="400" max="1100" step="10" /></label>
            <button type="button" data-f="default" class="camh">📌 Usar esta cámara en todos los clips</button>
            <button type="button" data-f="pic">🔄 Otro fotograma</button>
          </div>
        </div>
        <div class="texts">
          <div class="texts-row">
            <label class="sw"><input type="checkbox" class="f-hookOn" /> <b>Título en el video</b></label>
            <input class="f-gancho grow" maxlength="60" placeholder="Texto del título (arriba)" />
            <select class="f-hookDur" title="Cuánto tiempo se ve"><option value="4">4 s</option><option value="8">8 s</option><option value="0">Todo el clip</option></select>
          </div>
          <div class="texts-row">
            <label class="sw"><input type="checkbox" class="f-subsOn" /> <b>Subtítulos</b></label>
            <label class="slider">Tamaño <input type="range" class="f-subScale" min="60" max="140" step="5" /></label>
            <select class="f-subStyle" title="Color"><option value="">Color por defecto</option><option value="amarillo">Amarillo</option><option value="blanco">Blanco</option><option value="verde">Verde</option></select>
            <button class="act-subs">✏️ Editar subtítulos</button>
          </div>
          <p class="hint">Arrastrá el título o los subtítulos en el boceto para subirlos o bajarlos.</p>
          <div class="subs-editor hidden">
            <div class="subs-head"><span>Desde (s)</span><span>Hasta (s)</span><span>Texto</span><span></span></div>
            <div class="subs-list"></div>
            <div class="row">
              <button class="act-sub-add">➕ Agregar línea</button>
              <button class="act-sub-redo" title="Vuelve a escuchar el clip y reemplaza tus cambios">🔄 Volver a transcribir</button>
              <span class="subs-status muted"></span>
            </div>
          </div>
        </div>
        <details class="why"><summary>Por qué es gracioso / transcripción</summary><p class="porque"></p><pre class="transcript"></pre></details>
        <div class="tags"></div>
        <div class="row actions">
          <button class="primary act-render">⚙️ Generar short</button>
          <span class="rstatus"></span>
        </div>
        <div class="result hidden">
          <video controls preload="metadata"></video>
          <div class="row upload">
            <button class="act-yt">▶️ Subir a YouTube</button>
            <button class="act-ig">📸 Subir a Instagram</button>
            <button class="act-tt">🎵 Subir a TikTok</button>
            <button class="act-copy">📋 Copiar texto</button>
            <button class="act-folder">📂 Ver archivo</button>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
